    <script>(function(){

  // a feature on stale projects.

  // step (text-input feel); modifier-clicks stay multi-select. No second click.
  // When non-null: { el, originalText, onKey, onBlur } — suppresses hover ring
  // and Escape-toggles, and the click handler routes clicks inside the editing
  // element through native browser caret behaviour.

  // resource can delay load forever, so the gate also opens a capped wait after DOMContentLoaded.

  }
  var INLINE_EDIT_DENY = { INPUT: 1, TEXTAREA: 1, SELECT: 1, OPTION: 1, SCRIPT: 1, STYLE: 1, SVG: 1, PATH: 1, IMG: 1, CODE: 1, PRE: 1 };
  var INLINE_EDIT_SINGLE_LINE = { H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, BUTTON: 1, A: 1, LABEL: 1, SUMMARY: 1 };

  var COMPUTED_KEYS = ['color','backgroundColor','fontSize','fontWeight','fontFamily','textAlign','textDecorationLine','borderColor','borderWidth','borderStyle','borderRadius','opacity','display','paddingTop','paddingRight','paddingBottom','paddingLeft','marginTop','marginRight','marginBottom','marginLeft','width','height','gap','flexDirection','justifyContent','alignItems','lineHeight','letterSpacing','fontStyle','objectFit','boxShadow'];
  var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, LINK: 1, META: 1, HEAD: 1, NOSCRIPT: 1, TEMPLATE: 1 };
  // Crosshair while picking, text caret while inline-editing a contenteditable.
  // The [contenteditable="true"] rule on the editing element + descendants
  // overrides the global crosshair so the user sees the right affordance.
  var PICKER_CSS = '.blink-picker-active, .blink-picker-active * { cursor: crosshair !important; }' +
    ' html.blink-picker-active [data-blink-edit-hover] { cursor: text !important; }' +
    ' html.blink-picker-active [contenteditable="true"], html.blink-picker-active [contenteditable="true"] * { cursor: text !important; }' +
    // Inline text edit: a distinct thin solid border around the
    // contenteditable element (Figma parity — different from hover ring).
    ' html.blink-picker-editing [contenteditable="true"] { outline: 1.5px solid rgba(59,130,246,0.95) !important; outline-offset: 1px !important; border-radius: 2px !important; }' +
    // Neutralize the LEGACY widget.js picker's chrome. widget.js loads from
    // blink.new/widget.js (can't be gated in local previews), and its hover
    // tooltip (.gpt-selector-tooltip — the stray "h1" label) + dashed hover/
    // selected outlines double up with this v2 picker and the parent's Figma
    // selection overlay. v2 is the source of truth, so hide the legacy chrome.
    ' .gpt-selector-tooltip { display: none !important; }' +
    ' [data-blnk-hovered]::before, [data-blnk-selected]::before { display: none !important; }';

  // ---- short hash (CRC32-ish, 8-char hex) ----
  function shortHash(s){
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h = (h ^ s.charCodeAt(i)) >>> 0;
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    var hex = h.toString(16);
    while (hex.length < 8) hex = '0' + hex;
    return hex;
  }

  function siblingIndex(el){
    var i = 0;
    var n = el;
    while (n && n.previousElementSibling) { i++; n = n.previousElementSibling; }
    return i;
  }

  // "rt:<tag>:<siblingIndex>:<path hash><text hash>". The ancestor path keeps identical copies apart
  // (a desktop and a mobile nav); unchanged DOM gets the same id on every render.
  function makeRuntimeId(el){
    return runtimeIdAt(el, pathOf(el));
  }

  function runtimeIdAt(el, path){
    try {
      var txt = (el.textContent || '').slice(0, 32);
      return 'rt:' + path.slice(path.lastIndexOf('/') + 1) + ':' + shortHash(path) + shortHash(txt);
    } catch (err) {
      try { console.error('[blink-picker] runtimeIdAt failed', err); } catch (e2) {}
      return 'rt:div:0:0000000000000000';
    }
  }

  // The element's place below <html> as tag:siblingIndex segments, e.g. "body:1/div:0/nav:2".
  function pathOf(el){
    var segs = [];
    for (var n = el; n && n.nodeType === 1 && n !== document.documentElement; n = n.parentElement) {
      segs.push((n.tagName || 'div').toLowerCase() + ':' + siblingIndex(n));
    }
    return segs.reverse().join('/');
  }

  // A child's path from its parent's: index i among parent.children is its sibling index.
  function childPath(path, kid, i){
    return path + '/' + kid.tagName.toLowerCase() + ':' + i;
  }

  // ---- runtime identity (memory only) ----
  // A stale rt: attribute (markup copied from an old stamped DOM) is not a build id.
  function buildIdOf(el){
    var v = el.getAttribute('data-blnk-id');
    return v && v.slice(0, 3) !== 'rt:' ? v : null;
  }

  // An rt: id is computed on first use and kept for the element's lifetime, so text edits keep it.
  function idOf(el){
    var buildId = buildIdOf(el);
    if (buildId) return buildId;
    var id = runtimeIds.get(el) || makeRuntimeId(el);
    rememberRuntimeId(el, id);
    return id;
  }

  function rememberRuntimeId(el, id){
    runtimeIds.set(el, id);
    elementsById[id] = el;
  }

  function findById(id){
    if (typeof id !== 'string' || !id) return null;
    if (id.slice(0, 3) !== 'rt:') return document.querySelector('[data-blnk-id="' + id.replace(/"/g, '\\"') + '"]');
    var known = elementsById[id];
    if (known && known.isConnected) return known;
    if (known) delete elementsById[id];
    return document.body ? findRuntimeMatch(document.body, id) : null;
  }

  // Every element carrying a build id: a .map() renders one source line N times, and a style edit
  // previews on all of them (the edit lands on the shared markup). rt: ids resolve to one element.
  function findAllById(id){
    if (typeof id !== 'string' || !id) return [];
    if (id.slice(0, 3) === 'rt:') { var one = findById(id); return one ? [one] : []; }
    return Array.prototype.slice.call(document.querySelectorAll('[data-blnk-id="' + id.replace(/"/g, '\"') + '"]'));
  }

  // Document-order walk carrying each node's path, so a match costs no ancestor walk per node.
  function findRuntimeMatch(root, id){
    var match = walkForRuntimeId(root, id, pathOf(root));
    if (match) rememberRuntimeId(match, id);
    return match;
  }

  function walkForRuntimeId(node, id, path){
    if (isRuntimeCandidate(node, id) && (runtimeIds.get(node) || runtimeIdAt(node, path)) === id) return node;
    var kids = node.children;
    for (var i = 0; kids && i < kids.length; i++) {
      var hit = walkForRuntimeId(kids[i], id, childPath(path, kids[i], i));
      if (hit) return hit;
    }
    return null;
  }

  // Build-tagged elements report their build id, so only their descendants can match an rt: id.
  // The tag prefix check skips computing an id for elements of any other tag.
  function isRuntimeCandidate(el, id){
    if (SKIP_TAGS[el.tagName] || buildIdOf(el)) return false;
    return id.indexOf('rt:' + el.tagName.toLowerCase() + ':') === 0;
  }

  // ---- React fiber owner resolution ----
  function getFiberKey(el){
    var keys = Object.keys(el);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (/^__react(Fiber|Internals)/.test(k)) return k;
    }
    return null;
  }

  function getFiberSource(el){
    try {
      var key = getFiberKey(el);
      if (!key) return null;
      var fiber = el[key];
      var hops = 0;
      while (fiber && hops < 30) {
        if (fiber._debugSource && fiber._debugSource.fileName) {
          var s = fiber._debugSource;
          return { fileName: s.fileName, lineNumber: s.lineNumber || 0, columnNumber: s.columnNumber || 0 };
        }
        fiber = fiber.return || fiber._debugOwner || null;
        hops++;
      }
      return null;
    } catch (err) {
      try { console.error('[blink-picker] getFiberSource failed', err); } catch (e2) {}
      return null;
    }
  }

  function isEditorOrigin(o){
    if (typeof o !== 'string') return false;
    return EDITOR_ORIGINS.indexOf(o) !== -1 || TEAM_PREVIEW_ORIGIN.test(o) || (!!LOCAL_EDITOR_ORIGIN && LOCAL_EDITOR_ORIGIN.test(o));
  }

  function postToEditor(msg){
    if (!editorOrigin) return;
    window.parent.postMessage(msg, editorOrigin);
  }

  // The parent's first allowed origin is the editor (an iframe's parent can't change under a running
  // document); no other origin is obeyed afterwards, so none can read the page.
  function acceptsOrigin(o){
    if (editorOrigin) return o === editorOrigin;
    if (!isEditorOrigin(o)) return false;
    editorOrigin = o;
    return true;
  }

    var msg = ev.data;

    else if (msg.type === 'SET_ELEMENT_ATTRS') ownWrite(function(){ applyAttrs(msg.payload); });
    else if (msg.type === 'RESET_INLINE_STYLES') whenLoaded(function(){ resetInlineStyles(msg.payload); });

    else if (active) handleV3Message(msg);
  });

  // ---- v3 protocol (design mode only): tree, select/navigate, hover, reorder preview, area pick,
  // font preview (LOAD_FONT) and the theme colours (GET_THEME_COLORS → THEME_COLORS) ----

    var p = msg.payload || {};

    else if (msg.type === 'HOVER_ELEMENT') drawHover(typeof p.id === 'string' ? nthInstance(p.id, p.instanceIndex) : null);
    else if (msg.type === 'SELECT_ELEMENT') selectById(p.id, p.instanceIndex);
    else if (msg.type === 'NAVIGATE') navigate(p.id, p.dir, p.instanceIndex);

  // re-sends its rect, so a repeated TRACK_ELEMENTS can't loop with ELEMENT_RECT_UPDATE every frame.
  function trackElements(ids){

    var added = false;

      trackSelectedId(ids[i]);
      delete lastSentRects[ids[i]];

  // { id, properties: string[] } and we remove those inline-style props from
  // the matching element so the element's stylesheet/computed style takes over
  // again. Empty properties means "wipe everything we set" (last resort).

  // design mode. Replies on next microtask so the parent's listener is attached.

      // leak across deactivations. We cancel (don't commit) — toggling design

      clearSelectedRectTracking();
      hasSelection = false;
      treeSubscribed = false;

  function hideChrome(){

  // popup anchor using viewport coords from getBoundingClientRect at click
  // time. When the user scrolls the iframe, the element moves but the parent
  // UI doesn't — unless we re-emit the rect. Track every clicked id and post

  // the id would track the first instance instead of the one the user picked.
  var trackedEls = Object.create(null);
  var pendingReflow = false;
  var lastSentRects = Object.create(null);
  // The parent's selection (SET_SELECTION): arrows / Enter / Delete are claimed only while it is set.
  var hasSelection = false;

  function trackSelectedId(id) {
    if (typeof id !== 'string' || !id) return;
    selectedIds.add(id);
  }

  function clearSelectedRectTracking() {
    selectedIds.clear();
    trackedEls = Object.create(null);
    lastSentRects = Object.create(null);
  }

  function trackedElement(id) {

    if (el && el.isConnected) return el;
    delete trackedEls[id];
    return findById(id);

  function scheduleReflow() {

    // element needs repositioning. Without the hover branch, the hover
    // dashed ring stays orphaned at its initial viewport coords when the
    // user scrolls (mouseover only fires when the cursor changes elements).

    pendingReflow = true;

    raf(function(){
      pendingReflow = false;
      emitRectUpdates();
      repositionHover();
    });
  }

  function repositionHover() {
    if (!hoverEl) return;
    if (!hoverEl.isConnected) { hoverEl = null; drawHover(null); return; }
    drawHover(hoverEl);
  }

  function emitRectUpdates() {
    try {
      var updates = [];
      var ids = Array.from(selectedIds);
      for (var i = 0; i < ids.length; i++) {
        var el = trackedElement(ids[i]);
        if (!el) { selectedIds.delete(ids[i]); continue; }
        var u = rectUpdateFor(ids[i], el);
        if (u) updates.push(u);
      }
      if (updates.length === 0) return;
      postToEditor({ type: 'ELEMENT_RECT_UPDATE', payload: { updates: updates, viewportWidth: window.innerWidth } });
    } catch (err) {
      try { console.error('[blink-picker] emitRectUpdates failed', err); } catch (e2) {}
    }
  }

  // One update per selected element: its rect, child/sibling rects relative to it, padding/gap and its
  // sibling position (so a reorder or undo never leaves those stale). Skipped when nothing moved.
  function rectUpdateFor(id, el){
    var r = el.getBoundingClientRect();
    var rect = { x: r.x, y: r.y, width: r.width, height: r.height };
    var related = relatedRects(el, r);
    var place = siblingPlace(el);
    var sig = JSON.stringify([rect, related, place]);
    if (lastSentRects[id] === sig) return null;
    lastSentRects[id] = sig;
    return {
      id: id, rect: rect, childRects: related.childRects, siblingRects: related.siblingRects, spacing: spacingOf(el),
      parentId: place.parentId, siblingIds: place.siblingIds, siblingIndex: place.siblingIndex, instanceIndex: instanceIndexOf(el, id),

  }

  // Scroll / resize listeners fire scheduleReflow once per frame max. capture:
  // true on scroll catches nested scroll containers; passive avoids blocking.
  window.addEventListener('scroll', scheduleReflow, { passive: true, capture: true });
  window.addEventListener('resize', scheduleReflow);

  document.addEventListener('mouseover', function(e){
    if (!active) return;
    if (inlineEditing) return; // hover ring would compete with the caret
    var el = closestSelectable(e.target);
    if (el === hoverEl) return;
    setEditHover(hoverEl, el); // editable text shows an I-beam before you click
    hoverEl = el;
    drawHover(el);
  }, true);

  document.addEventListener('click', function(e){
    if (!active) return;
    // While editing, clicks inside the editing element use native browser
    // caret behaviour (no preventDefault). Clicking outside commits the
    // current edit and falls through to normal selection on the new target.
    if (inlineEditing) {
      if (inlineEditing.el.contains(e.target)) return;
      exitInlineEdit(inlineEditing.el, true);
      // Fall through — handle this click as a fresh selection.
    }
    var el = closestSelectable(e.target);
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
    // A plain click on an inline-editable text element selects it AND drops a
    // caret so it behaves like a text input (Kai's ask — no hidden second
    // click). ELEMENT_CLICKED fires first so the inspector still opens for
    // style; then we enter caret edit. Modifier-clicks (Cmd/Ctrl/Shift) stay
    // multi-select and never edit; non-text elements just select.
    var noMods = !(e.metaKey || e.ctrlKey || e.shiftKey);
    if (noMods && loaded && isInlineEditable(el)) {
      emitElementClicked(el, { meta: false, shift: false });
      enterInlineEdit(el, e);
      return;
    }
    // Track modifier so parent can dispatch single-select (replace) vs
    // multi-select toggle (Cmd/Ctrl-click — Lovable/Figma semantics).
    emitElementClicked(el, { meta: !!(e.metaKey || e.ctrlKey), shift: !!e.shiftKey });
  }, true);

  document.addEventListener('submit', function(e){ if (active) e.preventDefault(); }, true);

  document.addEventListener('keydown', function(e){
    if (!active) return;
    // The inline-edit own keydown handler (capture: true on the editing el)
    // owns Escape during edit — cancel restores text. Don't also toggle the
    // whole picker off here.
    if (inlineEditing) return;
    if (forwardKey(e, 'KEY_PRESSED')) return;
    if (e.key === 'Escape') {
      try { postToEditor({ type: 'TOGGLE_PICK_AND_EDIT_REQUESTED' }); } catch (err) {}
    }
  }, true);

  document.addEventListener('keyup', function(e){
    if (!active || inlineEditing) return;
    if (e.key === 'h' || e.key === 'H') forwardKey(e, 'KEY_RELEASED');
  }, true);

  // Nearest selectable element: any element except SKIP_TAGS and <html> (ids come from idOf).
  function closestSelectable(target){
    var el = target;
    while (el && el !== document.documentElement) {
      if (el.nodeType === 1 && !SKIP_TAGS[el.tagName]) return el;
      el = el.parentElement;
    }
    return null;
  }

  function parseIdLocation(id){
    // Build-time IDs are "<filePath>:<index>"; runtime IDs start with "rt:" and have no path.
    if (id && id.slice(0, 3) === 'rt:') {
      return { filePath: '', lineNumber: 0, col: 0 };
    }
    var lastColon = id ? id.lastIndexOf(':') : -1;
    if (lastColon < 0) return { filePath: id || '', lineNumber: 0, col: 0 };
    var filePath = id.slice(0, lastColon);
    var index = parseInt(id.slice(lastColon + 1), 10) || 0;
    return { filePath: filePath, lineNumber: 0, col: index };
  }

  function collectComputed(el){
    var cs = window.getComputedStyle(el);
    var out = {};
    for (var i = 0; i < COMPUTED_KEYS.length; i++) {
      var k = COMPUTED_KEYS[i];
      out[k] = cs[k];
    }
    return out;
  }

  function emitElementClicked(el, modifiers){
    try {
      var id = idOf(el);
      var loc = parseIdLocation(id);
      var r = el.getBoundingClientRect();
      var classes = el.classList ? Array.prototype.slice.call(el.classList) : [];
      var fiberSource = getFiberSource(el);
      var payload = {
        id: id,
        filePath: loc.filePath,
        lineNumber: loc.lineNumber,
        col: loc.col,
        tagName: (el.tagName || 'div').toLowerCase(),
